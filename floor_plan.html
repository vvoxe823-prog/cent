<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanForge — Architectural Drawing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ink:#163047;--muted:#60758a;--line:#b8c9d8;--paper:#fff;--bg:#eef5fa}
body{margin:0;background:linear-gradient(135deg,#eef7ff,#f8fbfd);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:24px}
.cardx{background:rgba(255,255,255,.84);border:1px solid rgba(150,180,205,.35);border-radius:22px;box-shadow:0 18px 50px rgba(36,78,110,.10);backdrop-filter:blur(14px)}
.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:800;font-size:1.45rem;letter-spacing:-.04em}
.logo span{background:linear-gradient(90deg,#2563eb,#06b6d4);-webkit-background-clip:text;color:transparent}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:linear-gradient(90deg,#2563eb,#06b6d4);color:#fff}
.secondary{background:#edf4f8;color:#27445a}
.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}
.side{padding:18px}
.plan-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:9px 12px;border-radius:12px;background:#eef4f8;color:#3c5870}
.tab.active{background:#163047;color:#fff}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{padding:12px;border-radius:14px;background:#f5f9fc}
.metric small{display:block;color:var(--muted);font-size:.72rem}.metric b{font-size:1rem}
.legend{margin-top:16px}.legend div{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.86rem}
.dot{width:13px;height:13px;border-radius:3px;border:1px solid #9eb0bf}
.stage{padding:16px;min-width:0}
.canvas-wrap{overflow:auto;border-radius:18px;background:#dce8f0;padding:18px;min-height:620px}
#canvas{display:block;background:#fff;box-shadow:0 15px 45px rgba(30,60,80,.16);margin:auto}
.warning{margin-top:12px;padding:12px 14px;border-radius:13px;background:#fff5e8;color:#81500b;font-size:.86rem}
.good{margin-top:12px;padding:12px 14px;border-radius:13px;background:#eaf9f1;color:#17643a;font-size:.86rem}
.note{color:var(--muted);font-size:.82rem;line-height:1.45;margin-top:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:2}.stage{order:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">Plan<span>Forge</span> <small style="font-size:.7rem;color:#6d8294">Architectural Drawing</small></div>
    <div class="controls">
      <button class="secondary" onclick="window.print()">Print / Save PDF</button>
      <button class="primary" onclick="downloadSVG()">Download SVG</button>
    </div>
  </div>

  <div class="cardx layout">
    <aside class="side">
      <div id="tabs" class="plan-tabs"></div>
      <div id="summary"></div>
      <div class="legend" id="legend"></div>
      <div class="note">Preliminary conceptual drawing. Dimensions are based on the generated room rectangles. This is not a construction drawing.</div>
    </aside>
    <main class="stage">
      <div class="canvas-wrap">
        <svg id="canvas" width="1100" height="760" viewBox="0 0 1100 760"></svg>
      </div>
      <div id="status"></div>
    </main>
  </div>
</div>

<script>
let payload=null, selected=0;

const fills={
  living:"#dceeff",master_bedroom:"#e7e1ff",bedroom:"#eee8ff",kitchen:"#fff0cf",
  dining:"#e5f7e9",bathroom:"#dff6f5",utility:"#e9f4ff",store:"#f2edf8",
  study:"#eaf0ff",pooja:"#fff1df",staircase:"#e9edf1",lift:"#e3e8ee",
  parking:"#f0f2f4",buffer:"#fff"
};
const labels={living:"Living",master_bedroom:"Master Bedroom",bedroom:"Bedroom",
kitchen:"Kitchen",dining:"Dining",bathroom:"Bathroom",utility:"Utility",store:"Store",
study:"Study",pooja:"Pooja",staircase:"Staircase",lift:"Lift",parking:"Parking"};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function drawPlan(){
  if(!payload) return;
  const p=payload.plans[selected], svg=document.getElementById("canvas");
  const W=p.buildable_area.width, D=p.buildable_area.depth;
  const margin=95, top=70, bottom=65, right=75;
  const scale=Math.min((1100-margin-right-margin)/W,(760-top-bottom)/D);
  const ox=margin, oy=top;
  const px=v=>ox+v*scale, py=v=>oy+v*scale;

  let s=`<rect x="0" y="0" width="1100" height="760" fill="#fff"/>
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#163047">PLANFORGE — ${esc(p.strategy.toUpperCase())} OPTION</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#60758a">${W.toFixed(1)}' × ${D.toFixed(1)}' buildable envelope · ${p.buildable_area.area.toFixed(0)} sq ft</text>`;

  // North arrow
  s+=`<line x1="1035" y1="100" x2="1035" y2="62" stroke="#163047" stroke-width="3"/>
  <path d="M1035 58 L1028 70 L1042 70 Z" fill="#163047"/>
  <text x="1035" y="118" text-anchor="middle" font-size="13" font-weight="800" fill="#163047">N</text>`;

  // Outer boundary
  s+=`<rect x="${px(0)}" y="${py(0)}" width="${W*scale}" height="${D*scale}" fill="#fafcfd" stroke="#18364b" stroke-width="4"/>`;

  // Dimension lines
  s+=`<line x1="${px(0)}" y1="${py(0)-28}" x2="${px(W)}" y2="${py(0)-28}" stroke="#647b8d"/>
  <line x1="${px(0)}" y1="${py(0)-34}" x2="${px(0)}" y2="${py(0)-22}" stroke="#647b8d"/>
  <line x1="${px(W)}" y1="${py(0)-34}" x2="${px(W)}" y2="${py(0)-22}" stroke="#647b8d"/>
  <text x="${(px(0)+px(W))/2}" y="${py(0)-35}" text-anchor="middle" font-size="13" fill="#40596c" font-weight="700">${W.toFixed(1)}'</text>`;

  s+=`<line x1="${px(W)+28}" y1="${py(0)}" x2="${px(W)+28}" y2="${py(D)}" stroke="#647b8d"/>
  <line x1="${px(W)+22}" y1="${py(0)}" x2="${px(W)+34}" y2="${py(0)}" stroke="#647b8d"/>
  <line x1="${px(W)+22}" y1="${py(D)}" x2="${px(W)+34}" y2="${py(D)}" stroke="#647b8d"/>
  <text x="${px(W)+48}" y="${(py(0)+py(D))/2}" transform="rotate(90 ${px(W)+48} ${(py(0)+py(D))/2})" text-anchor="middle" font-size="13" fill="#40596c" font-weight="700">${D.toFixed(1)}'</text>`;

  for(const r of p.rooms){
    if(r.kind==="buffer") continue;
    const x=px(r.x), y=py(r.y), w=r.width*scale, h=r.depth*scale;
    const fill=fills[r.kind]||"#eef3f6";
    const title=labels[r.kind]||r.kind;
    const fs=Math.max(10,Math.min(15,Math.min(w,h)/7));
    s+=`<g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#29485c" stroke-width="2"/>
      <text x="${x+w/2}" y="${y+h/2-5}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#173448">${esc(title)}</text>
      <text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" font-size="${Math.max(9,fs-2)}" fill="#587083">${r.width.toFixed(1)}' × ${r.depth.toFixed(1)}'</text>
    </g>`;
  }

  // Road/front indicator
  s+=`<text x="${(px(0)+px(W))/2}" y="${py(D)+42}" text-anchor="middle" font-size="12" font-weight="800" fill="#526a7c">FRONT / ROAD SIDE</text>`;
  svg.innerHTML=s;

  document.getElementById("status").innerHTML=p.valid
    ? `<div class="good">✓ Valid non-overlapping preliminary layout · score ${p.score}</div>`
    : `<div class="warning">⚠ No complete valid layout was found for this option. Do not use this drawing for construction.</div>`;
}

function renderUI(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=payload.plans.map((p,i)=>`<button class="tab ${i===selected?"active":""}" onclick="selected=${i};renderUI()">${p.strategy}</button>`).join("");
  const p=payload.plans[selected];
  const rooms=p.rooms||[];
  const counts={}; rooms.forEach(r=>counts[r.kind]=(counts[r.kind]||0)+1);
  document.getElementById("summary").innerHTML=`
    <div class="meta">
      <div class="metric"><small>Buildable area</small><b>${p.buildable_area.area.toFixed(0)} sq ft</b></div>
      <div class="metric"><small>Envelope</small><b>${p.buildable_area.width.toFixed(1)} × ${p.buildable_area.depth.toFixed(1)} ft</b></div>
      <div class="metric"><small>Plan score</small><b>${p.score}</b></div>
      <div class="metric"><small>Status</small><b>${p.valid?"VALID":"NOT VALID"}</b></div>
    </div>
    <div style="margin-top:16px;font-weight:800">Placed spaces</div>
    <div class="note">${Object.entries(counts).map(([k,v])=>`${labels[k]||k}: ${v}`).join(" · ")||"None"}</div>`;
  document.getElementById("legend").innerHTML="<b>Legend</b>"+Object.entries(fills).filter(([k])=>k!=="buffer").slice(0,13).map(([k,c])=>`<div><span class="dot" style="background:${c}"></span>${labels[k]||k}</div>`).join("");
  drawPlan();
}

function downloadSVG(){
  const svg=document.getElementById("canvas");
  const blob=new Blob([svg.outerHTML],{type:"image/svg+xml"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="planforge-floor-plan.svg"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function init(){
  const raw=sessionStorage.getItem("planforge_result");
  if(raw){payload=JSON.parse(raw);renderUI();return;}
  document.getElementById("status").innerHTML='<div class="warning">No generated plan found. Submit the PlanForge form first.</div>';
}
init();
</script>
</body>
</html>
